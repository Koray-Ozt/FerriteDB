[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ferritedb"
version = "0.1.0"
description = "Official Python SDK for FerriteDB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "FSL-1.1-ALv2" }
authors = [
    { name = "FerriteDB Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/Koray-Ozt/FerriteDB"
Documentation = "https://github.com/Koray-Ozt/FerriteDB#readme"
Repository = "https://github.com/Koray-Ozt/FerriteDB.git"
Issues = "https://github.com/Koray-Ozt/FerriteDB/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ferritedb"]
