name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test -p ferrite-cli --features crash-testing --test crash_recovery --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo fmt --all --check
      - run: cargo audit
      - run: bash scripts/release-acceptance.sh
      - name: Build release packages
        run: bash scripts/build-release.sh dist
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p \"require('./sdk/typescript/package.json').version\")"
      - name: Validate publish payloads
        run: |
          npm publish ./dist/ferritedb-linux-x64-*.tgz --access public --provenance --tag beta --dry-run
          npm publish ./dist/ferritedb-sdk-*.tgz --access public --provenance --tag beta --dry-run
      - name: Check existing platform package
        id: platform
        run: |
          package=./dist/ferritedb-linux-x64-*.tgz
          version=$(node -p "require('./packages/linux-x64/package.json').version")
          if remote=$(npm view "@ferritedb/linux-x64@$version" dist.shasum); then
            test "$remote" = "$(sha1sum $package | cut -d' ' -f1)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish platform package
        if: steps.platform.outputs.publish == 'true'
        run: npm publish ./dist/ferritedb-linux-x64-*.tgz --access public --provenance --tag beta
      - name: Check existing SDK package
        id: sdk
        run: |
          package=./dist/ferritedb-sdk-*.tgz
          version=$(node -p "require('./sdk/typescript/package.json').version")
          if remote=$(npm view "@ferritedb/sdk@$version" dist.shasum); then
            test "$remote" = "$(sha1sum $package | cut -d' ' -f1)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish SDK package
        if: steps.sdk.outputs.publish == 'true'
        run: npm publish ./dist/ferritedb-sdk-*.tgz --access public --provenance --tag beta
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --prerelease
