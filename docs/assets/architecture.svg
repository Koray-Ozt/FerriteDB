<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">FerriteDB architecture</title>
  <desc id="desc">Language SDKs communicate with a local Rust sidecar, which uses transactions, WAL, page cache and an indexed page store.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="590" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="590" rx="22" fill="url(#grid)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="52" y="58" fill="#f8fafc" font-size="25" font-weight="700">FerriteDB architecture</text>
    <text x="52" y="84" fill="#64748b" font-size="13">planned system boundary · solid = implemented tracer bullet · dashed = planned</text>

    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M250 190H354"/>
      <path d="M554 190H658"/>
      <path d="M858 190H962"/>
      <path d="M760 245V330"/>
      <path d="M760 414V475"/>
    </g>

    <g transform="translate(52 135)">
      <rect width="198" height="110" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="20" y="36" fill="#67e8f9" font-size="16" font-weight="700">Language SDKs</text>
      <text x="20" y="64" fill="#94a3b8" font-size="12">TypeScript · Rust</text>
      <text x="20" y="84" fill="#94a3b8" font-size="12">Python · Go</text>
    </g>

    <g transform="translate(354 135)">
      <rect width="200" height="110" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="20" y="36" fill="#fdba74" font-size="16" font-weight="700">Local IPC</text>
      <text x="20" y="64" fill="#94a3b8" font-size="12">versioned protocol</text>
      <text x="20" y="84" fill="#94a3b8" font-size="12">Unix socket / named pipe</text>
    </g>

    <g transform="translate(658 135)">
      <rect width="200" height="110" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="20" y="36" fill="#6ee7b7" font-size="16" font-weight="700">Rust sidecar</text>
      <text x="20" y="64" fill="#94a3b8" font-size="12">schema · queries</text>
      <text x="20" y="84" fill="#94a3b8" font-size="12">lifecycle · limits</text>
    </g>

    <g transform="translate(962 135)">
      <rect width="186" height="110" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="20" y="36" fill="#c4b5fd" font-size="16" font-weight="700">Transactions</text>
      <text x="20" y="64" fill="#94a3b8" font-size="12">snapshot reads</text>
      <text x="20" y="84" fill="#94a3b8" font-size="12">single writer</text>
    </g>

    <g transform="translate(658 330)">
      <rect width="200" height="84" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
      <text x="20" y="34" fill="#7dd3fc" font-size="17" font-weight="700">Checksummed WAL</text>
      <text x="20" y="60" fill="#94a3b8" font-size="12">begin · put · commit · fsync</text>
    </g>

    <g transform="translate(658 475)">
      <rect width="200" height="72" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="20" y="31" fill="#c4b5fd" font-size="16" font-weight="700">Page store + B+ tree</text>
      <text x="20" y="53" fill="#94a3b8" font-size="12">cache · indexes · recovery</text>
    </g>

    <g transform="translate(52 462)">
      <rect width="430" height="86" rx="10" fill="#0b1220" stroke="#334155"/>
      <circle cx="23" cy="26" r="5" fill="#38bdf8"/><text x="39" y="31" fill="#cbd5e1" font-size="12">Implemented and covered by tests</text>
      <line x1="18" y1="57" x2="30" y2="57" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="39" y="62" fill="#cbd5e1" font-size="12">Planned; API and format may change</text>
    </g>
  </g>
</svg>
