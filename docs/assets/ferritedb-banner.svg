<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">FerriteDB</title>
  <desc id="desc">Local-first database engine built in Rust</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#101b32"/>
      <stop offset="1" stop-color="#211442"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#334155" stroke-opacity=".25"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1035" cy="65" r="155" fill="#7c3aed" opacity=".11"/>
  <circle cx="1125" cy="260" r="115" fill="#0ea5e9" opacity=".10"/>

  <g transform="translate(84 60)" filter="url(#glow)">
    <ellipse cx="96" cy="30" rx="72" ry="24" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <path d="M24 30v112c0 14 32 26 72 26s72-12 72-26V30" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <path d="M24 68c0 14 32 26 72 26s72-12 72-26M24 105c0 14 32 26 72 26s72-12 72-26" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <path d="M74 42h44l-18 37h29l-52 62 13-46H61z" fill="url(#accent)"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="300" y="128" fill="#f8fafc" font-size="64" font-weight="700" letter-spacing="-3">FerriteDB</text>
    <rect x="302" y="146" width="590" height="4" rx="2" fill="url(#accent)"/>
    <text x="302" y="190" fill="#cbd5e1" font-size="23">local-first · crash-aware · language-neutral</text>
    <text x="302" y="229" fill="#94a3b8" font-size="17">A reliable database engine taking shape in Rust.</text>
  </g>

  <g transform="translate(930 218)" font-family="ui-monospace, monospace" font-size="13">
    <rect width="178" height="40" rx="20" fill="#0f172a" stroke="#34d399"/>
    <circle cx="23" cy="20" r="5" fill="#34d399"/>
    <text x="39" y="25" fill="#d1fae5">EARLY DEVELOPMENT</text>
  </g>
</svg>
